<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu - Calculadora de Clicks</title>
  <style>
    :root {
      --bg-1: #07111f;
      --bg-2: #0b1d33;
      --card: rgba(14, 24, 40, 0.72);
      --card-border: rgba(255, 255, 255, 0.12);
      --text: #f5f7fb;
      --muted: #9fb0c8;
      --accent: #69d2ff;
      --accent-2: #8a7dff;
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(105, 210, 255, 0.22), transparent 28%),
        radial-gradient(circle at top right, rgba(138, 125, 255, 0.24), transparent 24%),
        linear-gradient(160deg, var(--bg-1), var(--bg-2));
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .container { width: min(980px, 100%); }

    .hero { text-align: center; margin-bottom: 24px; }
    .hero h1 { margin: 0; font-size: clamp(2rem, 4vw, 3.5rem); letter-spacing: -0.04em; }
    .hero p { margin: 10px auto 0; max-width: 640px; color: var(--muted); line-height: 1.6; }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 18px;
    }

    .card {
      position: relative;
      overflow: hidden;
      padding: 22px;
      border-radius: 24px;
      background: var(--card);
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      text-decoration: none;
      color: inherit;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(105, 210, 255, 0.28);
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.42);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(105, 210, 255, 0.12), transparent 40%, rgba(138, 125, 255, 0.12));
      pointer-events: none;
    }

    .label {
      display: block;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 0.92rem;
      position: relative;
      z-index: 1;
    }

    .stone-box {
      display: flex;
      align-items: center;
      gap: 14px;
      position: relative;
      z-index: 1;
    }

    .stone-icon {
      width: 64px;
      height: 64px;
      flex: 0 0 64px;
      border-radius: 18px;
      object-fit: cover;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.04);
    }

    .stone-meta strong {
      display: block;
      font-size: 1.15rem;
      margin-bottom: 4px;
    }

    .stone-meta span {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .card-footer {
      margin-top: 18px;
      color: var(--accent);
      font-weight: 700;
      position: relative;
      z-index: 1;
    }

    .muted {
      color: var(--muted);
      font-weight: 400;
      display: block;
      margin-top: 8px;
    }

    .footer-note {
      margin-top: 18px;
      color: var(--muted);
      text-align: center;
      font-size: 0.92rem;
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="hero">
      <h1>Menu de Calculadoras</h1>
      <p>Escolha o tipo de item para abrir a calculadora correspondente.</p>
    </section>

    <section class="cards">
      <a class="card" href="pedra-crom.html" aria-label="Abrir calculadora de pedra cron">
        <span class="label">Pedra Cron</span>
        <div class="stone-box">
          <img class="stone-icon" src="img/Pedra Cron.png" alt="Ícone da pedra cron" />
          <div class="stone-meta">
            <strong>Calculadora de cliques</strong>
          </div>
        </div>
        <div class="card-footer">
          Abrir calculadora
        </div>
      </a>

      <a class="card" href="acessorios-kharazad.html" aria-label="Abrir calculadora de acessórios Kharazad">
        <span class="label">Acessórios Kharazad</span>
        <div class="stone-box">
          <img class="stone-icon" src="img/Acessório Kharazad.png" alt="Ícone dos acessórios Kharazad" />
          <div class="stone-meta">
            <strong>Calculadora de acessórios</strong>
          </div>
        </div>
        <div class="card-footer">
          Abrir calculadora
        </div>
      </a>

      <a class="card" href="pedra-alquimia.html" aria-label="Abrir menu de pedra de alquimia">
        <span class="label">Pedra de Alquimia upgrade</span>
        <div class="stone-box">
          <img class="stone-icon" src="img/pedra de alquimia.png" alt="Ícone da pedra de alquimia" />
          <div class="stone-meta">
            <strong>Pedra de Alquimia upgrade</strong>
          </div>
        </div>
        <div class="card-footer">
          Abrir calculadora
        </div>
      </a>
    </section>

  </main>
</body>
</html>
